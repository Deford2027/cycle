:root{--bg:#E3E7DE;--ink:#1c2417;--mut:#6b7466;--line:#e6e9e1;--soft:#f0f3ec;--dark:#1F3A12;--lil:#C98FD3;--lilS:#f3e6f6;--lime:#B6D98C;--limeS:#ebf5dc;--r:28px;--sh:0 10px 30px rgba(45,65,35,.07);--disp:Manrope,system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,-apple-system,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lil);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font:700 44px/1.08 var(--disp);letter-spacing:-.045em}
h2{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
svg.i{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:1200px;margin:0 auto;padding:24px 24px 60px}
.nav{display:flex;align-items:center;gap:4px;background:#fff;border-radius:24px;padding:9px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.logo{font:400 32px/1 'Marck Script',cursive;padding:0 14px 0 12px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;flex:none}
.logo i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lil);margin-left:3px;vertical-align:14px}
.nav button{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:17px;white-space:nowrap;font-weight:600;font-size:14.5px;flex:none;transition:.15s}
.nav button:hover{background:var(--soft)}.nav button.on{background:var(--dark);color:#fff}
.nav b{background:#dcb3e3;color:#3b1f41;border-radius:20px;padding:0 8px;font-size:12px}
.top{display:flex;gap:12px;margin:14px 0 26px;position:relative}
.sq{width:50px;height:50px;border-radius:18px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh)}
.sq.dk{background:var(--dark);color:#fff}
.search{flex:1;min-width:0;height:50px;border:0;border-radius:18px;background:#fff;padding:0 20px;box-shadow:var(--sh)}
.date{height:50px;border-radius:18px;background:#fff;padding:0 18px;display:flex;align-items:center;white-space:nowrap;font-weight:600;font-size:14px;box-shadow:var(--sh)}
.found{position:absolute;z-index:30;left:0;right:0;top:58px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 20px 60px rgba(30,50,20,.2);max-height:60vh;overflow:auto}
.found button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:14px}.found button:hover{background:var(--soft)}.found span{color:var(--mut);font-size:13px;margin-left:auto;white-space:nowrap}
.hi{margin-bottom:24px}.hi .bon{font:400 30px/1 'Marck Script',cursive;color:#649440;display:none}.hi p{color:var(--mut);max-width:680px;margin-top:8px;font-size:15.5px}
.journal{--disp:Oranienbaum,Georgia,serif}
.journal h1{font-weight:400;text-transform:uppercase;letter-spacing:-.01em;font-size:58px;color:var(--dark)}
.journal .hi .bon{display:block}.journal .hi p,.journal .catline{font:italic 500 21px/1.35 'Cormorant Infant',Georgia,serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}.hi .chips{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:600;color:#46503f}
.chip.l{background:var(--lilS)}.chip.b{background:#e3f0f1}.chip.g{background:var(--limeS)}.chip.o{border:1px solid var(--line)}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
button.chip:hover{filter:brightness(.97)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.wide{grid-column:1/-1}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--sh);min-width:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.hd .sp{margin-left:auto}.hd .ic{width:38px;height:38px;border-radius:13px;background:var(--limeS);display:grid;place-items:center}.hd .ic.l{background:var(--lilS)}.hd .ic.r{background:#f6e1df}.hd .ic.b{background:#dfeceb}
.mut{color:var(--mut);font-size:13.5px}.lab{color:var(--mut);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--dark);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:14px}.btn:hover{background:#2b4e1b}
.btn.s{background:#fff;color:var(--ink);border:1px solid #dfe4d9}.btn.s:hover{background:var(--soft)}.btn.m{padding:8px 13px;border-radius:13px;font-size:13px}.btn.red{background:#fbe9e7;color:#8c2f25}
.inp{width:100%;background:var(--soft);border:1px solid transparent;border-radius:16px;padding:13px 16px;outline-offset:0}
.inp:focus{background:#fff;border-color:var(--lime)}textarea.inp{min-height:110px;resize:vertical}

function startCard(d,t,ts){if(d.energy&&!U.start)return `<section class="card wide"><div class="row" style="padding:0">${ck('mainDone','',d.mainDone)}<div class="t ${d.mainDone?'done':''}"><small>Главное на сегодня</small><span class="tt">${esc(d.main||"не выбрано")}</span></div><span class="chip g">⚡ ${d.energy}</span>${d.mood?`<span class="chip l">🙂 ${d.mood}</span>`:''}<button class="mini" data-a="startEdit" aria-label="Изменить">${I('edit')}</button></div>${d.built?(l=>`<div class="note">План собран${d.rest?' на день отдыха':' под силы '+d.energy+' из 5'}: ${pl(l.length,'дело','дела','дел')}, ${hm(l.reduce((s,x)=>s+x.dur,0))}.${d.rest_n?' Ещё '+d.rest_n+' без времени: делай, если останутся силы.':''}</div>`)(ts.filter(x=>x.time)):''}<div class="chips" style="margin-top:12px"><button class="btn m" data-a="build">${d.built?'↻ Пересобрать':'✨ Собрать день'}</button><button class="btn s m" data-a="planSet">Мой обычный день</button>${(d.skip||[]).length?'<button class="btn s m" data-a="unskip">Вернуть убранное</button>':''}</div></section>`;
const sc=(k,l,h)=>`<div><div class="lab">${l}</div><div class="scale">${[1,2,3,4,5].map(n=>`<button class="${d[k]===n?'on':''}" aria-pressed="${d[k]===n}" aria-label="${l} ${n}" data-a="scale" data-k="${k}" data-n="${n}">${n}</button>`).join('')}</div><p class="mut" style="margin-top:6px">${h}</p></div>`;
return `<section class="card wide"><div class="hd"><h2>Сколько сегодня сил?</h2><span class="sp"></span><span class="mut">нажми цифру энергии, и я соберу день</span></div><div class="grid two" style="gap:4px 24px">${sc('energy','Энергия','без сил → полно сил')}${sc('mood','Настроение','грустно → отлично')}</div><div class="lab">Главное на сегодня (если пусто, выберу само)</div><input class="inp" data-c="main" aria-label="Главное на сегодня" value="${esc(d.main||'')}" placeholder="Одна главная вещь сегодня, например «позвонить маме»"><div class="chips" style="margin-top:10px">${ts.filter(x=>!x.done).slice(0,4).map(x=>`<button class="chip o" data-a="mainSet" data-id="${x.id}">${esc(x.text)}</button>`).join('')}${U.start?'<button class="btn m" data-a="startOk">Готово</button>':''}<button class="btn s m" data-a="planSet">Мой обычный день</button></div></section>`}

buy:d=>{const r=get('rewards',d.id);if(!r.wish&&balance()<r.price)return toast('Не хватает: '+(r.price-balance()));S.buys.push({id:uid(),name:r.name,price:r.price,date:today()});if(r.wish)del('rewards',r.id);save();confetti();render()},unbuy:d=>{del('buys',d.id);save();render()},
quick:()=>{const o=modal(`<h3>Что добавить?</h3><div class="chips">${[['taskEd','Задачу'],['repEd','Постоянную задачу'],['wordEd','Слово'],['bankAdd','В копилку'],['mealEd','Еду'],['textEd','Текст'],['habEd','Привычку'],['focEd','Время']].map(([a,l])=>`<button class="btn s" data-a="${a}">${l}</button>`).join('')}</div>`)},
hit:d=>{if(d.own)U.own=d.own;if(d.txt)U.txt=d.txt;if(d.k)U[d.k]=d.k==='week'?+d.kv:d.kv;$('#q').value='';$('#found').hidden=true;go(d.v)}};
function cycForm(old,d){form('Начало месячных',[['d','Первый день','date']],{d},r=>{if(r.d>today()){toast('Дата не может быть в будущем');return}const s=S.cycle.starts.filter(x=>x!==old);s.push(r.d);S.cycle.starts=[...new Set(s)].sort()},old?()=>{S.cycle.starts=S.cycle.starts.filter(x=>x!==old)}:null)}
document.addEventListener('click',e=>{if(!e.target.closest('.top'))$('#found').hidden=true;const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a]({...b.dataset})});
document.addEventListener('change',e=>{const k=e.target.dataset?.c,v=e.target.value,d=e.target.dataset;if(k==='main'){setDay(today(),{main:v.trim()});const r=day(today());if(r.energy&&!U.start)setTimeout(render,200)}else if(k==='word')setDay(d.d,{word:v.trim()});else if(k==='win'){const w=[...(day(d.d).wins||['','',''])];w[+d.i]=v.trim();setDay(d.d,{wins:w})}else if(k==='tArea'){S.timer.area=v;save()}else if(k==='mday'){if(v){U.mday=v;render()}}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d?.c==='gap'&&U.ex)U.ex.v[d.i]=e.target.value;if(e.target.id==='q')search(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#found').hidden=true;if(e.key==='Enter'&&e.target.dataset?.c==='main')e.target.blur()});
function search(q){q=q.trim().toLowerCase();const f=$('#found');if(q.length<2){f.hidden=true;return}const R=[],ad=(t,l,v,x='')=>{if(String(t).toLowerCase().includes(q))R.push(`<button data-a="hit" data-v="${v}" ${x}>${esc(String(t).slice(0,90))}<span>${l}</span></button>`)};S.words.forEach(x=>ad(x.w+' – '+x.t,'слово','lang','data-k="lang" data-kv="dict"'));S.texts.forEach(x=>ad(x.title+' '+x.text,'текст','lang',`data-k="lang" data-kv="text" data-txt="${x.id}"`));S.tasks.forEach(x=>ad(x.text,'задача · '+fmt(x.date),'week',`data-k="week" data-kv="${diff(monday(today()),monday(x.date))/7}"`));S.goals.forEach(x=>ad(x.text,'цель','week'));S.habits.forEach(x=>ad(x.name,'привычка','hab'));S.bank.forEach(x=>ad(x.title+' '+x.ing+' '+x.text+' '+x.tag,KIND[x.kind][0].toLowerCase(),'bank','data-k="bank" data-kv="all"'));S.workouts.forEach(x=>ad(x.name,'тренировка','heart','data-k="health" data-kv="sport"'));S.own.forEach(o=>o.items.forEach(x=>ad(x.title+' '+(x.note||''),esc(o.name),'own',`data-own="${o.id}"`)));S.rewards.forEach(x=>ad(x.name,'награда','gift'));f.innerHTML=R.slice(0,20).join('')||'<p class="empty" style="padding:14px">Ничего не нашлось</p>';f.hidden=false}
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const n=norm(JSON.parse(e.newValue));if(n){S=n;if(!$('.ov')&&!typing())render()}}catch(x){}}});
function newDay(){if(today()!==U.day0&&!$('.ov')&&!typing()){U.day0=today();U.itog=null;U.start=false;U.pd=0;render()}}
setInterval(()=>{if(S.timer.end)tick();newDay()},500);document.addEventListener('visibilitychange',()=>{if(!document.hidden){newDay();tick()}});
$('#bg').innerHTML=I('gear');$('#bp').innerHTML=I('plus');$('#bs').innerHTML=I('find');go(location.hash.slice(1)||'home');if(bad)toast('Старые данные не прочитались: их копия сохранена, открыты примеры');
</script>
</body>
